<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USA Power & Policy</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #0b1220;
  color: #fff;
  margin: 0;
  padding: 16px;
}
h1 {
  color: #4da3ff;
  text-align: center;
}
.card {
  background: #16233b;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 10px;
}
button {
  background: #1f6feb;
  color: white;
  border: none;
  padding: 12px 18px;
  border-radius: 8px;
  font-size: 16px;
  margin: 4px;
}
button:active {
  background: #0d4da3;
}
#log {
  background: #101a2c;
  height: 180px;
  overflow-y: auto;
  padding: 10px;
  border-radius: 8px;
  font-size: 14px;
}
</style>
</head>
<body>

<h1>USA POWER & POLICY</h1>

<div class="card">
  <b>Presidente:</b> Joe Biden<br>
  <b>Data:</b> <span id="date"></span><br>
  <b>Velocità:</b> <span id="speed"></span>
</div>

<div class="card">
  <b>Approvazione:</b> <span id="approval"></span><br>
  <b>PIL:</b> <span id="gdp"></span> miliardi<br>
  <b>Inflazione:</b> <span id="inflation"></span>%<br>
  <b>Disoccupazione:</b> <span id="unemployment"></span>%<br>
  <b>Debito:</b> <span id="debt"></span> miliardi
</div>

<div class="card">
  <button onclick="startGame()">START</button>
  <button onclick="pauseGame()">PAUSA</button>
  <button onclick="setSpeed(1)">1x</button>
  <button onclick="setSpeed(2)">2x</button>
  <button onclick="setSpeed(5)">5x</button>
  <button onclick="setSpeed(10)">10x</button>
</div>

<div class="card">
  <b>Eventi</b>
  <div id="log"></div>
</div>

<script>
let date = new Date(2024, 0, 1);
let approval = 40;
let gdp = 27000;
let inflation = 3.4;
let unemployment = 3.7;
let debt = 34000;
let speed = 1;
let running = false;
let timer = null;

function updateScreen() {
  document.getElementById("date").innerText =
    date.toLocaleDateString("it-IT");

  document.getElementById("speed").innerText = speed + "x";
  document.getElementById("approval").innerText = approval.toFixed(1) + "%";
  document.getElementById("gdp").innerText = gdp.toFixed(0);
  document.getElementById("inflation").innerText = inflation.toFixed(1);
  document.getElementById("unemployment").innerText = unemployment.toFixed(1);
  document.getElementById("debt").innerText = debt.toFixed(0);
}

function addEvent(text) {
  const log = document.getElementById("log");
  const p = document.createElement("p");
  p.innerText = text;
  log.prepend(p);
}

function advanceDay() {
  date.setDate(date.getDate() + 1);

  const economicPressure =
    (inflation - 2) * 0.4 +
    (unemployment - 4) * 0.8 -
    2.1 * 0.5;

  approval -= economicPressure * 0.05;

  if (approval < 15) approval = 15;
  if (approval > 75) approval = 75;

  gdp += gdp * (2.1 / 100 / 365);
  debt += 1700 / 365;

  inflation += (Math.random() - 0.5) * 0.02;
  unemployment += (Math.random() - 0.5) * 0.03;

  if (inflation < 0.5) inflation = 0.5;
  if (inflation > 9) inflation = 9;

  if (unemployment < 2) unemployment = 2;
  if (unemployment > 12) unemployment = 12;

  if (Math.random() < 0.02) {
    const events = [
      "Crisi internazionale in Ucraina.",
      "Nuovo dibattito al Congresso.",
      "Aumento dei prezzi dell'energia.",
      "Sciopero nei trasporti.",
      "Nuovo sondaggio favorevole al Presidente.",
      "Tensioni con la Cina.",
      "Attacco informatico a infrastrutture federali.",
      "Disastro naturale in uno Stato."
    ];
    addEvent(events[Math.floor(Math.random() * events.length)]);
  }

  updateScreen();
}

function startGame() {
  if (running) return;
  running = true;
  timer = setInterval(advanceDay, 1000 / speed);
  addEvent("Simulazione avviata.");
}

function pauseGame() {
  running = false;
  clearInterval(timer);
  addEvent("Simulazione in pausa.");
}

function setSpeed(newSpeed) {
  speed = newSpeed;
  if (running) {
    clearInterval(timer);
    timer = setInterval(advanceDay, 1000 / speed);
  }
  updateScreen();
}

updateScreen();
</script>

</body>
</html>
